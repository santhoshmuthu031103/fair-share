<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF2F0" />
      <stop offset="100%" stop-color="#EBDAD8" />
    </linearGradient>

    <linearGradient id="hand-terra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2410C" />
      <stop offset="100%" stop-color="#9C3925" />
    </linearGradient>

    <linearGradient id="hand-gold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#5C4747" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" stroke="rgba(90,45,38,0.12)" stroke-width="8" />

  <g transform="translate(256, 256)" filter="url(#drop-shadow)">
    <circle cx="0" cy="0" r="148" fill="none" stroke="rgba(156,57,37,0.08)" stroke-width="16" />

    <path 
      d="M -130 -20 
         C -130 -100, -60 -150, 20 -150 
         C 80 -150, 130 -110, 140 -50 
         C 145 -15, 120 10, 85 10 
         C 50 10, 30 -20, 15 -50 
         C 5 -75, -40 -90, -75 -70 
         C -100 -50, -110 -10, -85 25 
         C -65 55, -85 85, -110 75 
         C -125 70, -130 30, -130 -20 Z" 
      fill="url(#hand-terra)" 
    />

    <path 
      d="M 130 20 
         C 130 100, 60 150, -20 150 
         C -80 150, -130 110, -140 50 
         C -145 15, -120 -10, -85 -10 
         C -50 -10, -30 20, -15 50 
         C -5 75, 40 90, 75 70 
         C 100 50, 110 10, 85 -25 
         C 65 -55, 85 -85, 110 -75 
         C 125 -70, 130 -30, 130 20 Z" 
      fill="url(#hand-gold)" 
    />

    <circle cx="0" cy="0" r="38" fill="#FAF2F0" stroke="rgba(90,45,38,0.15)" stroke-width="4" />
    <circle cx="0" cy="0" r="26" fill="url(#hand-terra)" />
    
    <path d="M -12 -2 Q 0 12 12 -2" fill="none" stroke="#FAF2F0" stroke-width="4" stroke-linecap="round" />
