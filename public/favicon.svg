<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="fairshare-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C3925" />
      <stop offset="100%" stop-color="#7B2418" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  <!-- Background Icon Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#fairshare-grad)" />
  
  <!-- Interlocking Twin FairShare Split Wings -->
  <g transform="translate(106, 106)">
    <!-- Left Wing -->
    <path d="M 50 150 C 50 70, 110 30, 170 30 C 120 70, 110 130, 140 180 C 160 215, 150 250, 120 270 C 80 260, 50 210, 50 150 Z" fill="#FAF2F0" opacity="0.95" />
    
    <!-- Right Symmetrical Wing -->
    <path d="M 250 150 C 250 230, 190 270, 130 270 C 180 230, 190 170, 160 120 C 140 85, 150 50, 180 30 C 220 40, 250 90, 250 150 Z" fill="url(#gold-grad)" />
    
    <!-- Center Equal Rupee Balance Node -->
    <circle cx="150" cy="150" r="28" fill="#FAF2F0" />
    <circle cx="150" cy="150" r="18" fill="#9C3925" />
  </g>
</svg>